# Render Blueprint: New + > Blueprint, point at this repo
databases:
  - name: timetable-db
    plan: free
    databaseName: timetable
services:
  - type: web
    name: timetable-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: timetable-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
  - type: web
    name: timetable-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://timetable-api.onrender.com   # <- your API URL
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
